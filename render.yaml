# =============================================================
# Render Blueprint
# =============================================================
#
# The database is NOT defined here on purpose.
#
# Render's own free Postgres is deleted after 30 days, so this
# deploys against an external managed Postgres instead - Neon by
# default. That means DATABASE_URL is something you paste in once
# rather than something Render wires up automatically.
#
# Render dashboard -> New -> Blueprint -> point at this repo.

services:
  - type: web
    name: gpms-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health

    envVars:

      # Your Neon connection string, pasted whole:
      #   postgresql://user:password@ep-xxx.region.aws.neon.tech/gpms?sslmode=require
      #
      # DatabaseUrlEnvironmentPostProcessor splits it into the JDBC
      # url/username/password before Flyway runs, and adds
      # sslmode=require if you paste one without it.
      #
      # sync:false means Render prompts for it instead of storing it
      # in this file - keep the password out of the repository.
      - key: DATABASE_URL
        sync: false

      # 32+ characters, generated once by Render and never committed.
      # Changing it invalidates every issued token.
      - key: APP_JWT_SECRET
        generateValue: true

      # The address a DRIVER'S PHONE can reach, used to build the SMS
      # pass link. Set to this service's own URL once it exists:
      #   https://gpms-backend.onrender.com
      - key: APP_PUBLIC_BASE_URL
        sync: false

      # Driver SMS goes to the log until a real provider is added.
      - key: APP_SMS_PROVIDER
        value: logging

      - key: APP_BOOTSTRAP_ENABLED
        value: "true"

      # Change this immediately after the first successful deploy.
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
