server:
  # Render (and most PaaS hosts) inject the port to listen on as
  # PORT and route external traffic to it. Hardcoding 8080 means the
  # health check never connects and the deploy is marked failed.
  port: ${PORT:8080}

spring:
  application:
    name: warehouse-dispatch-gpms-backend
  # No fallback credentials.
  #
  # These used to default to gpms/gpms, which meant a deployment that
  # forgot an environment variable did not fail - it quietly ran on a
  # password published in this repository. Unset now means the app
  # refuses to start and says which placeholder it could not resolve,
  # which is the failure you want. docker-compose.yml and
  # application-local.yml both supply them for development.
  # Zoho India SMTP, for the forgotten-password code.
  #
  # The password here is NOT the mailbox password: Zoho refuses those
  # from SMTP once two-factor is on. It is an app-specific password,
  # generated per application in the Zoho security settings, and it is
  # read from the environment so it never sits in this file.
  #
  # Unset mail means the flow still works end to end on a developer
  # machine - the code is written to the log instead of sent (see
  # PasswordResetMailer).
  mail:
    host: ${SPRING_MAIL_HOST:smtp.zoho.in}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 587 with STARTTLS rather than 465 with implicit SSL: it is
          # the port least likely to be blocked outbound by a host.
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gpms}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # Sized for a serverless Postgres (Neon, Supabase) that goes to
      # sleep when idle and takes a few seconds to wake.
      #
      # connection-timeout allows for that wake-up rather than failing
      # the first request after a quiet period.
      connection-timeout: 30000

      # Do not abort startup if the database is still waking. Boot
      # retries instead of the container dying and Render marking the
      # deploy failed.
      initialization-fail-timeout: 60000

      # Free tiers cap concurrent connections, and this runs on a
      # single small instance - a large pool would exhaust the
      # database's allowance for no benefit.
      maximum-pool-size: 5
      minimum-idle: 1

      # Recycle before a serverless provider drops an idle connection
      # underneath us.
      idle-timeout: 120000
      max-lifetime: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

# The API documentation describes every endpoint and its payloads, and
# the paths serving it are public. Off unless a deployment asks for it,
# so a production server does not hand out a map of itself.
springdoc:
  api-docs:
    enabled: ${APP_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_DOCS_ENABLED:false}
    path: /swagger-ui.html

app:
  # ---------------------------------------------------------------
  # The address this backend is publicly reachable on. Used wherever
  # a generated document or link has to name the server.
  # ---------------------------------------------------------------
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8081}

  # ---------------------------------------------------------------
  # The super-admin site at /superadmin.
  #
  # Not a row in the users table on purpose: nothing a company admin can
  # do may ever produce an account that opens it. With no password set, a
  # random one is generated and printed in the startup log.
  # ---------------------------------------------------------------
  superadmin:
    username: ${APP_SUPERADMIN_USERNAME:superadmin}
    password: ${APP_SUPERADMIN_PASSWORD:}

  jwt:
    # No usable default on purpose. The placeholder is refused outside
    # the local profile (see JwtService), because a signing key that is
    # published in a repository is not a key.
    secret: ${APP_JWT_SECRET:change-me-to-a-32-character-minimum-secret}
    allow-insecure-secret: ${APP_ALLOW_INSECURE_JWT_SECRET:false}
    # A day was a long time to hold a stolen phone's token. There is no
    # revocation list, so the expiry is the only thing that ends a
    # session - eight hours is one shift.
    access-token-minutes: ${APP_JWT_ACCESS_MINUTES:480}
  storage:
    minio:
      endpoint: ${APP_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      # Same reasoning as the datasource above: minioadmin/minioadmin
      # was a published default, not a default.
      access-key: ${APP_STORAGE_MINIO_ACCESS_KEY}
      secret-key: ${APP_STORAGE_MINIO_SECRET_KEY}
      bucket: ${APP_STORAGE_MINIO_BUCKET:gpms-attachments}
  mail:
    # The name a reset email appears under in an inbox.
    from-name: ${APP_MAIL_FROM_NAME:Gate Pass}
  password-reset:
    # Long enough to find the mail and type six digits, short enough
    # that a code left in an inbox is not a standing key to the account.
    validity-minutes: ${APP_PASSWORD_RESET_VALIDITY_MINUTES:10}
    # How long before another code may be sent to the same address, so
    # the form cannot be used to post mail at somebody.
    resend-seconds: ${APP_PASSWORD_RESET_RESEND_SECONDS:60}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    warehouse-code: ${APP_BOOTSTRAP_WAREHOUSE_CODE:WH-01}
    warehouse-name: ${APP_BOOTSTRAP_WAREHOUSE_NAME:Primary Warehouse}
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@gpms.local}
    admin-full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:System Admin}
    manager-username: ${APP_BOOTSTRAP_MANAGER_USERNAME:manager}
    manager-password: ${APP_BOOTSTRAP_MANAGER_PASSWORD:Manager@123}
    manager-email: ${APP_BOOTSTRAP_MANAGER_EMAIL:manager@gpms.local}
    manager-full-name: ${APP_BOOTSTRAP_MANAGER_FULL_NAME:Warehouse Manager}
    employee-username: ${APP_BOOTSTRAP_EMPLOYEE_USERNAME:employee}
    employee-password: ${APP_BOOTSTRAP_EMPLOYEE_PASSWORD:Employee@123}
    employee-email: ${APP_BOOTSTRAP_EMPLOYEE_EMAIL:employee@gpms.local}
    employee-full-name: ${APP_BOOTSTRAP_EMPLOYEE_FULL_NAME:Warehouse Employee}

gpms:
  reporting:
    # The zone a working day is measured in. "Issued today" and the
    # other daily counters run midnight to midnight here, not on the
    # server's clock - the warehouse decides when its day starts.
    zone: ${GPMS_REPORTING_ZONE:Asia/Kolkata}
