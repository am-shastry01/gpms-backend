server:
  port: 8080

spring:
  application:
    name: warehouse-dispatch-gpms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gpms}
    username: ${SPRING_DATASOURCE_USERNAME:gpms}
    password: ${SPRING_DATASOURCE_PASSWORD:gpms}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-32-character-minimum-secret}
    access-token-minutes: ${APP_JWT_ACCESS_MINUTES:1440}
  storage:
    minio:
      endpoint: ${APP_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${APP_STORAGE_MINIO_BUCKET:gpms-attachments}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    warehouse-code: ${APP_BOOTSTRAP_WAREHOUSE_CODE:WH-01}
    warehouse-name: ${APP_BOOTSTRAP_WAREHOUSE_NAME:Primary Warehouse}
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@gpms.local}
    admin-full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:System Admin}
    manager-username: ${APP_BOOTSTRAP_MANAGER_USERNAME:manager}
    manager-password: ${APP_BOOTSTRAP_MANAGER_PASSWORD:Manager@123}
    manager-email: ${APP_BOOTSTRAP_MANAGER_EMAIL:manager@gpms.local}
    manager-full-name: ${APP_BOOTSTRAP_MANAGER_FULL_NAME:Warehouse Manager}
    employee-username: ${APP_BOOTSTRAP_EMPLOYEE_USERNAME:employee}
    employee-password: ${APP_BOOTSTRAP_EMPLOYEE_PASSWORD:Employee@123}
    employee-email: ${APP_BOOTSTRAP_EMPLOYEE_EMAIL:employee@gpms.local}
    employee-full-name: ${APP_BOOTSTRAP_EMPLOYEE_FULL_NAME:Warehouse Employee}
    security-username: ${APP_BOOTSTRAP_SECURITY_USERNAME:security}
    security-password: ${APP_BOOTSTRAP_SECURITY_PASSWORD:Security@123}
    security-email: ${APP_BOOTSTRAP_SECURITY_EMAIL:security@gpms.local}
    security-full-name: ${APP_BOOTSTRAP_SECURITY_FULL_NAME:Security Guard}
