<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{superadmin/layout :: head('Sign in')}"></head>
<body>
<main style="max-width:420px;padding-top:72px">

    <h1>Gatepass control</h1>
    <p class="lede">Company onboarding and oversight.</p>

    <div class="notice bad" th:if="${param.error}">
        That username or password is not right.
    </div>

    <div class="notice good" th:if="${param.signedout}">
        Signed out.
    </div>

    <div class="notice bad" th:if="${param.locked}">
        Too many wrong attempts from this address.
        Try again in <span th:text="${param.locked[0]}">15</span> minutes.
    </div>

    <form class="card" th:action="@{/superadmin/login}" method="post">

        <div style="margin-bottom:14px">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus autocomplete="username">
        </div>

        <div style="margin-bottom:20px">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
        </div>

        <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>

    <p class="hint" style="margin-top:16px">
        These credentials come from the server's environment, not from any
        company's user list.
    </p>

</main>
</body>
</html>
